[build]
  publish = "."

# ============ Security & SEO Headers ============
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; frame-src 'self' https:; connect-src 'self' https:; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"

# ============ إجبار المتصفح على قراءة صفحات الفيديو كـ HTML ============
[[headers]]
  for = "/watch/*"
  [headers.values]
    Content-Type = "text/html; charset=utf-8"

# ============ Cache Control ============
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

# ============ Pretty URLs ============
[[redirects]]
  from = "/watch/:id"
  to = "/watch.html?id=:id"
  status = 200

[[redirects]]
  from = "/genre"
  to = "/genre.html"
  status = 200

[[redirects]]
  from = "/search"
  to = "/search.html"
  status = 200

[[redirects]]
  from = "/series"
  to = "/series.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/dmca"
  to = "/dmca.html"
  status = 200

# ============ 404 Fallback ============
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404