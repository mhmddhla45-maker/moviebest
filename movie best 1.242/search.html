<script>
(function(){
  'use strict';
  const params = new URLSearchParams(location.search);
  let query = params.get('q') || '';
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  function normalize(str) {
    return String(str || '').toLowerCase()
      .replace(/[أإآ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه')
      .replace(/[\u064B-\u0652]/g, '');
  }

  function cardHTML(item) {
    const badge = item.type === "series"
      ? `<span class="card-badge">الحلقة ${item.episode || 1}</span>`
      : `<span class="card-badge">${item.year || ''}</span>`;
    const seriesLabel = item.type === "series" && item.name
      ? `<span class="card-series">${esc(item.name)}</span>` : "";
    return `
      <article class="card" data-type="${item.type}" data-id="${item.id}">
        <a class="card-link" href="/watch/${encodeURIComponent(item.id)}">
          <div class="card-media">
            ${badge}
            <span class="card-quality">${esc(item.quality || '')}</span>
            <img src="${esc(item.image || '')}" alt="${esc(item.title)}" loading="lazy">
            <div class="card-play"><span><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5-11-6.5z"/></svg></span></div>
          </div>
          <div class="card-body">
            ${seriesLabel}
            <h3 class="card-title">${esc(item.title)}</h3>
            <div class="card-meta">
              <span class="card-star">★ ${esc(item.rating || "—")}</span>
              <span class="sep"></span>
              <span>${esc(item.year || '')}</span>
            </div>
          </div>
        </a>
        <button class="fav-btn" data-fav-id="${item.id}" title="إضافة للمفضلة" aria-label="إضافة للمفضلة" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        </button>
      </article>`;
  }

  const searchInput = document.getElementById('searchInput');
  const resultsGrid = document.getElementById('resultsGrid');
  const emptyState = document.getElementById('emptyState');
  const resultsCount = document.getElementById('resultsCount');
  const searchSub = document.getElementById('searchSub');

  function doSearch(q) {
    q = (q || '').trim();
    if (!q) {
      resultsGrid.innerHTML = '';
      resultsCount.textContent = '';
      emptyState.hidden = true;
      searchSub.textContent = 'اكتب كلمة للبحث في الأفلام والمسلسلات';
      return;
    }
    const nq = normalize(q);
    const matches = DATA.filter(item => {
      const hay = normalize([item.title, item.name, item.year, ...(item.genres || [])].join(' '));
      return hay.includes(nq);
    });
    const seenSeries = new Set();
    const finalMatches = matches.filter(item => {
      if (item.type === 'series') {
        if (seenSeries.has(item.name)) return false;
        seenSeries.add(item.name);
      }
      return true;
    });
    resultsCount.textContent = finalMatches.length + ' نتيجة';
    searchSub.innerHTML = `نتائج البحث عن: <strong style="color:var(--text)">${esc(q)}</strong>`;
    resultsGrid.innerHTML = finalMatches.map(cardHTML).join('');
    emptyState.hidden = finalMatches.length > 0;
    if (history.replaceState) {
      const url = new URL(location.href);
      url.searchParams.set('q', q);
      history.replaceState(null, '', url);
    }
    document.title = `${q} — البحث — Movie Best`;
    if (window.MB) MB.Favorites.updateButtons();
  }

  if (searchInput) {
    searchInput.value = query;
    searchInput.addEventListener('input', (e) => doSearch(e.target.value));
    searchInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') e.preventDefault(); });
  }

  if (searchInput && !query) searchInput.focus();
  doSearch(query);
  document.getElementById('year').textContent = new Date().getFullYear();
})();
</script>
<script src="/assets/js/header.js"></script>
<script>

  document.addEventListener('contextmenu', event => event.preventDefault());
  
  document.onkeydown = function(e) {
    if(e.keyCode == 123) { return false; } // F12
    if(e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) { return false; }
    if(e.ctrlKey && e.shiftKey && e.keyCode == 'C'.charCodeAt(0)) { return false; }
    if(e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) { return false; }
    if(e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) { return false; }
  };
</script>
