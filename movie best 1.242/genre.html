<script src="/assets/js/data.js"></script>
<script>
(function(){
  'use strict';
  const params = new URLSearchParams(location.search);
  const genre = params.get('g');
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const app = document.getElementById('app');

  if (!genre) {
    const counts = {};
    DATA.forEach(item => {
      (item.genres || []).forEach(g => { counts[g] = (counts[g] || 0) + 1; });
    });
    const allGenres = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);

    let html = '<div class="genre-grid">';
    allGenres.forEach(g => {
      html += `
        <a href="/genre?g=${encodeURIComponent(g)}" class="genre-tile">
          <span class="genre-tile-name">${esc(g)}</span>
          <span class="genre-tile-count"><b>${counts[g]}</b> عمل</span>
        </a>
      `;
    });
    html += '</div>';
    app.innerHTML = html;
    document.title = 'التصنيفات — Movie Best';
  } else {
    const items = DATA.filter(x => (x.genres || []).includes(genre));
    const seriesMap = new Map();
    const movies = [];
    items.forEach(x => {
      if (x.type === 'series') {
        const existing = seriesMap.get(x.name);
        if (!existing || (Number(x.season) || 1) < (Number(existing.season) || 1) ||
            ((Number(x.season) || 1) === (Number(existing.season) || 1) && (Number(x.episode) || 1) < (Number(existing.episode) || 1))) {
          seriesMap.set(x.name, x);
        }
      } else { movies.push(x); }
    });
    const series = [...seriesMap.values()].sort((a,b) => (Number(b.year)||0) - (Number(a.year)||0));
    movies.sort((a,b) => (Number(b.year)||0) - (Number(a.year)||0));

    function cardHTML(item) {
      const badge = item.type === "series"
        ? `<span class="card-badge">الحلقة ${item.episode || 1}</span>`
        : `<span class="card-badge">${item.year || ''}</span>`;
      const seriesLabel = item.type === "series" && item.name
        ? `<span class="card-series">${esc(item.name)}</span>` : "";
      return `
        <article class="card" data-type="${item.type}" data-id="${item.id}">
          <a class="card-link" href="/watch/${encodeURIComponent(item.id)}">
            <div class="card-media">
              ${badge}
              <span class="card-quality">${esc(item.quality || '')}</span>
              <img src="${esc(item.image || '')}" alt="${esc(item.title)}" loading="lazy">
              <div class="card-play"><span><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5-11-6.5z"/></svg></span></div>
            </div>
            <div class="card-body">
              ${seriesLabel}
              <h3 class="card-title">${esc(item.title)}</h3>
              <div class="card-meta">
                <span class="card-star">★ ${esc(item.rating || "—")}</span>
                <span class="sep"></span>
                <span>${esc(item.year || '')}</span>
              </div>
            </div>
          </a>
          <button class="fav-btn" data-fav-id="${item.id}" title="إضافة للمفضلة" aria-label="إضافة للمفضلة" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
          </button>
        </article>`;
    }

    let html = `
      <div class="section-head">
        <div>
          <h2 class="section-title"><span class="bar"></span> ${esc(genre)}</h2>
          <p class="section-sub">${items.length} عمل · ${series.length} مسلسل · ${movies.length} فيلم</p>
        </div>
        <a href="genre.html" class="chip" style="padding:8px 16px">← كل التصنيفات</a>
      </div>
      ${series.length ? `<section class="section"><div class="section-head"><h3 class="section-title"><span class="bar"></span> مسلسلات (${series.length})</h3></div><div class="grid">${series.map(cardHTML).join('')}</div></section>` : ''}
      ${movies.length ? `<section class="section"><div class="section-head"><h3 class="section-title"><span class="bar"></span> أفلام (${movies.length})</h3></div><div class="grid">${movies.map(cardHTML).join('')}</div></section>` : ''}
      ${!items.length ? '<div class="empty-state"><div class="empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></div><h3>لا يوجد محتوى في هذا التصنيف</h3><p><a href="genre.html">تصفح كل التصنيفات</a></p></div>' : ''}
    `;
    app.innerHTML = html;
    document.title = `${genre} — Movie Best`;
    if (window.MB) MB.Favorites.updateButtons();
  }

  const searchInput = document.getElementById('searchInput');
  if (searchInput) {
    searchInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        e.preventDefault();
        const q = searchInput.value.trim();
        if (q) location.href = '/search?q=' + encodeURIComponent(q);
      }
    });
  }
  document.getElementById('year').textContent = new Date().getFullYear();
})();
</script>
<script src="/assets/js/header.js"></script>
<script>

  document.addEventListener('contextmenu', event => event.preventDefault());
  
  document.onkeydown = function(e) {
    if(e.keyCode == 123) { return false; } // F12
    if(e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) { return false; }
    if(e.ctrlKey && e.shiftKey && e.keyCode == 'C'.charCodeAt(0)) { return false; }
    if(e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) { return false; }
    if(e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) { return false; }
  };
</script>
